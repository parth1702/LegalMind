<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shield-grad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="core-glow" x1="20" y1="20" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Protective Shield Frame -->
  <path d="M32 6L54 14V30C54 44.5 44.5 56 32 60C19.5 56 10 44.5 10 30V14L32 6Z" 
        stroke="url(#shield-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="#050814" fill-opacity="0.9"/>

  <!-- Document & Intelligence Inner Geometry -->
  <path d="M22 22H42V42H22V22Z" stroke="#22d3ee" stroke-width="1.8" stroke-dasharray="4 2" opacity="0.6"/>
  <path d="M26 18L38 18" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Neural AI Core Node & Spark -->
  <circle cx="32" cy="32" r="6" fill="url(#core-glow)" filter="url(#glow-filter)"/>
  <circle cx="32" cy="32" r="3" fill="#ffffff"/>

  <!-- Connecting Intelligence Rays -->
  <line x1="32" y1="16" x2="32" y2="24" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="40" x2="32" y2="48" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="32" x2="24" y2="32" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="32" x2="48" y2="32" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
</svg>
